
# auth config(frontend --> this backend service)
auth:
  token_secret: example-secret-change-me
  token_expire_hour: 720
  users:
    - username: user1
      password: pass1

# aws config lives in ../backend-aws/config.yaml + config.0.yaml.
# the tag service binding (dynamodb tables + 3_tag name index of aws_oa
# _3_tag_and_type) is read from that sub-project's config_gen.yaml through
# aws_oa.project_dir of the aws config, no keys needed here.

# elasticsearch index config
elasticsearch:
  endpoint_use: local
  local:
    host: 127.0.0.1
    port: 9200
    scheme: http
    index_name: tab_cloud_tab
    number_of_shards: 1

# http server config
server:
  host: 0.0.0.0
  port: 8300
  cors_origin_list: []  # empty list allows any origin
